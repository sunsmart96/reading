  <rect x="650" y="477" width="480" height="84" rx="12" fill="#e8edf4" stroke="#9ba8bb" class="b"/><text x="890" y="528" text-anchor="middle" class="l">基础设施 / 硬件</text><text x="890" y="611" text-anchor="middle" class="n">隔离更完整 · 开销更大 · 启动较慢</text>
